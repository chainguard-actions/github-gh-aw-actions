name: Test deprecated safe-output-artifact-client is a no-op
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure RUNNER_TEMP does not resolve to /tmp (act defaults to /tmp)
        run: |
          RESOLVED="$(cd "${RUNNER_TEMP:-/tmp}" 2>/dev/null && pwd -P || echo /tmp)"
          if [ -z "$RUNNER_TEMP" ] || [ "${RESOLVED%/}" = "/tmp" ]; then
            mkdir -p /tmp/act-runner-temp
            echo "RUNNER_TEMP=/tmp/act-runner-temp" >> "$GITHUB_ENV"
          fi
      - id: action
        uses: .
        with:
          safe-output-artifact-client: 'true'
          destination: /tmp/gh-aw-deprecated-dest
      - name: Assert action still copies files
        env:
          ACTUAL: ${{ steps.action.outputs.files_copied }}
        run: |
          echo "files_copied: $ACTUAL"
          if ! [[ "$ACTUAL" =~ ^[0-9]+$ ]] || [ "$ACTUAL" -le 0 ]; then
            echo "FAIL: files_copied not a positive integer"
            exit 1
          fi
          if [ ! -f /tmp/gh-aw-deprecated-dest/action_setup_otlp.cjs ]; then
            echo "FAIL: expected file not copied"
            exit 1
          fi
          echo "PASS"
