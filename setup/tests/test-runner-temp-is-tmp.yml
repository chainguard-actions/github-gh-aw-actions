name: Test RUNNER_TEMP resolving to /tmp is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          RUNNER_TEMP: /tmp
      - name: Assert action failed due to tree collision
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FILES: ${{ steps.action.outputs.files_copied }}
        run: |
          echo "outcome: $OUTCOME"
          echo "files_copied: $FILES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail when RUNNER_TEMP=/tmp"
            exit 1
          fi
          if [ -n "$FILES" ]; then
            echo "FAIL: files_copied should not be set on failure"
            exit 1
          fi
          if [ -d /tmp/gh-aw/actions ] && [ -n "$(ls -A /tmp/gh-aw/actions 2>/dev/null)" ]; then
            echo "FAIL: files should not have been copied"
            exit 1
          fi
          echo "PASS"
