name: Test RUNNER_TEMP resolving to /tmp is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          RUNNER_TEMP: /tmp
        with:
          destination: /tmp/should-not-be-created-dest
      - name: Assert action failed fast
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FILES: ${{ steps.action.outputs.files_copied }}
        run: |
          echo "outcome: $OUTCOME"
          echo "files_copied: $FILES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when RUNNER_TEMP=/tmp"
            exit 1
          fi
          if [ -n "$FILES" ]; then
            echo "FAIL: no files_copied output expected"
            exit 1
          fi
          if [ -d /tmp/should-not-be-created-dest ]; then
            echo "FAIL: destination should not have been created"
            exit 1
          fi
          echo "PASS"
