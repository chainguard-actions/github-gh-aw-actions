name: Test custom destination
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUNNER_TEMP: /tmp/act-runner-temp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare RUNNER_TEMP
        run: mkdir -p /tmp/act-runner-temp
      - id: action
        uses: .
        with:
          destination: /tmp/act-runner-temp/custom/nested/dest
      - name: Assert files copied to custom destination
        env:
          ACTUAL: ${{ steps.action.outputs.files_copied }}
        run: |
          DEST=/tmp/act-runner-temp/custom/nested/dest
          echo "files_copied: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$' || [ "$ACTUAL" -le 0 ]; then
            echo "FAIL: expected a positive integer"
            exit 1
          fi
          if [ ! -d "$DEST" ]; then
            echo "FAIL: destination not created"
            exit 1
          fi
          COUNT=$(ls -1 "$DEST" | wc -l)
          echo "files in dest: $COUNT"
          if [ "$COUNT" -lt "$ACTUAL" ]; then
            echo "FAIL: file count ($COUNT) < files_copied ($ACTUAL)"
            exit 1
          fi
          if [ ! -f "$DEST/action_setup_otlp.cjs" ]; then
            echo "FAIL: action_setup_otlp.cjs missing in custom destination"
            exit 1
          fi
          if [ -d "$RUNNER_TEMP/gh-aw/actions" ] && [ -n "$(ls -A "$RUNNER_TEMP/gh-aw/actions")" ]; then
            echo "FAIL: default destination should not be populated"
            exit 1
          fi
          echo "PASS"
