name: 'Setup gh-aw CLI'
description: 'Install gh-aw CLI extension using latest, an exact tag, or a major-version channel'
author: 'GitHub Next'

inputs:
  version:
    description: 'Version to install: latest, a release tag like v0.37.18, or a major-version channel like v1'
    required: false
    default: latest
  github-token:
    description: 'GitHub token for authentication (used for gh CLI and API calls)'
    required: false
    default: ${{ github.token }}

outputs:
  installed-version:
    description: 'The version that was installed'
    value: ${{ steps.install-windows.outputs.installed_version || steps.install-unix.outputs.installed_version }}
  
runs:
  using: 'composite'
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Install gh-aw CLI (PowerShell)
      id: install-windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.github-token }}
        ACTION_PATH: ${{ github.action_path }}
      run: '& "$env:ACTION_PATH/install.ps1"'

    - name: Install gh-aw CLI (Bash)
      id: install-unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.github-token }}
        ACTION_PATH: ${{ github.action_path }}
      run: "$ACTION_PATH/install.sh"

branding:
  icon: 'download'
  color: 'purple'
