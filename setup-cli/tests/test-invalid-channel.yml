name: Test nonexistent major channel fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: v999
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ACTUAL: ${{ steps.action.outputs.installed-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "installed-version: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent channel v999"
            exit 1
          fi
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected no installed-version output"
            exit 1
          fi
          echo "PASS"
