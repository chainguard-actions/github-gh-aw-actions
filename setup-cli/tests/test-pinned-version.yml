name: Test pinned version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v0.37.18
      - name: Assert installed-version equals requested tag
        env:
          ACTUAL: ${{ steps.action.outputs.installed-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "v0.37.18" ]; then
            echo "FAIL: expected 'v0.37.18'"
            exit 1
          fi
          echo "PASS"
      - name: Assert binary installed and runnable
        run: |
          BIN="$HOME/.local/share/gh/extensions/gh-aw/gh-aw"
          if [ -x "$BIN" ]; then
            "$BIN" version
            echo "PASS: binary at $BIN"
          elif command -v gh >/dev/null 2>&1 && gh aw version; then
            echo "PASS: gh aw available"
          else
            echo "FAIL: gh-aw binary not found"
            exit 1
          fi
