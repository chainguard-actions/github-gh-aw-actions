name: Test major-version channel install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v0
      - name: Assert channel resolved to a v0.x.y tag
        env:
          ACTUAL: ${{ steps.action.outputs.installed-version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^v0\.[0-9]+\.[0-9]+$'; then
            echo "FAIL: expected a v0.X.Y tag"
            exit 1
          fi
          echo "PASS"
      - name: Assert binary installed
        run: |
          BIN="$HOME/.local/share/gh/extensions/gh-aw/gh-aw"
          if [ -x "$BIN" ]; then
            echo "PASS: binary at $BIN"
          elif command -v gh >/dev/null 2>&1 && gh aw version; then
            echo "PASS: gh aw available"
          else
            echo "FAIL: gh-aw binary not found"
            exit 1
          fi
