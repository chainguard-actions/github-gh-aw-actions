name: Test install specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v0.37.18
      - name: Assert installed-version output
        env:
          ACTUAL: ${{ steps.action.outputs.installed-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "v0.37.18" ]; then
            echo "FAIL: expected 'v0.37.18'"
            exit 1
          fi
          echo "PASS"
      - name: Assert binary installed and runnable
        run: |
          BIN="$HOME/.local/share/gh/extensions/gh-aw/gh-aw"
          ls -la "$HOME/.local/share/gh/extensions/gh-aw/" || true
          if [ ! -x "$BIN" ]; then
            echo "FAIL: binary not found or not executable at $BIN"
            exit 1
          fi
          OUT="$("$BIN" version 2>&1 || true)"
          echo "version output: $OUT"
          if ! echo "$OUT" | grep -q "0.37.18"; then
            echo "FAIL: binary version output does not mention 0.37.18"
            exit 1
          fi
          echo "PASS"
