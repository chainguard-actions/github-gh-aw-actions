name: Test install latest (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert installed-version output
        env:
          ACTUAL: ${{ steps.action.outputs.installed-version }}
        run: |
          echo "actual: $ACTUAL"
          # Manual download path reports "latest"; gh extension path reports the resolved vX.Y.Z
          if [ "$ACTUAL" = "latest" ] || echo "$ACTUAL" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "PASS"
          else
            echo "FAIL: expected 'latest' or a vX.Y.Z tag"
            exit 1
          fi
      - name: Assert binary installed
        run: |
          BIN="$HOME/.local/share/gh/extensions/gh-aw/gh-aw"
          if [ ! -x "$BIN" ]; then
            echo "FAIL: binary not found or not executable at $BIN"
            exit 1
          fi
          "$BIN" --help > /dev/null 2>&1 || { echo "FAIL: binary --help failed"; exit 1; }
          echo "PASS"
