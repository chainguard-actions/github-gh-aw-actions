name: Test latest (default) install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert installed-version is set
        env:
          ACTUAL: ${{ steps.action.outputs.installed-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" = "latest" ] || echo "$ACTUAL" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "PASS"
          else
            echo "FAIL: expected 'latest' or a vX.Y.Z tag"
            exit 1
          fi
      - name: Assert binary installed and runnable
        run: |
          BIN="$HOME/.local/share/gh/extensions/gh-aw/gh-aw"
          if [ -x "$BIN" ]; then
            "$BIN" version
            echo "PASS: binary at $BIN"
          elif command -v gh >/dev/null 2>&1 && gh aw version; then
            echo "PASS: gh aw available"
          else
            echo "FAIL: gh-aw binary not found"
            exit 1
          fi
